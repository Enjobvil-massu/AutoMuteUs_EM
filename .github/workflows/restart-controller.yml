name: Verify restart controller

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build restart controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Format check
        shell: bash
        run: |
          test -z "$(gofmt -l restart-controller/main.go)"

      - name: Build
        run: |
          cd restart-controller
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/restart-controller main.go

      - name: Verify Docker image builds
        run: docker build --tag automuteus-restart-controller:verify ./restart-controller

  push:
    name: Push restart controller
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./restart-controller
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/automuteus_restart_controller:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/automuteus_restart_controller:sha-${{ github.sha }}
